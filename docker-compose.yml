# Dev compose (SQLite/Prisma local). Requiere .env acorde; revisar PII en backend/prisma/dev.db antes de compartir.
services:
  backend:
    image: node:20-alpine
    container_name: paradaviva-backend
    working_dir: /app
    command: sh -c "npm ci && npm run db:generate && npm run dev"
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:./prisma/dev.db}
      PORT: 4000
    volumes:
      - ./backend:/app
      - paradaviva_backend_node_modules:/app/node_modules
    ports:
      - "4000:4000"

  frontend:
    image: node:20-alpine
    container_name: paradaviva-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    volumes:
      - ./frontend:/app
      - paradaviva_frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  paradaviva_backend_node_modules:
  paradaviva_frontend_node_modules:
