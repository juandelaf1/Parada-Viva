openapi: 3.0.3
info:
  title: Parada Viva API (stub alineado, no auto-generado)
  version: 0.2.0
  description: |
    Stub alineado manualmente con la API Express real. Fuente de verdad operativa: `backend/src`.
    P1/P8/P7: procedencia/contract_version en respuestas; sin PII en exports/reportes; ofuscar ubicación sensible (D8). No mezclar con EnRuta.
    Auth actual es stub (`x-user-email`, spoofable) — D8 pendiente. Reportes requieren `X-Report-Key` (stopgap D8).
    Seed/fixtures: `sintético/demo` (P1), no partners verificados.
servers:
  - url: http://localhost:3001
paths:
  /api/health:
    get:
      summary: Health + contrato/capabilities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, contract_version, capabilities]
                properties:
                  status: { type: string }
                  service: { type: string }
                  version: { type: string }
                  contract_version: { type: string, example: parada-viva-api/0.1 }
                  capabilities: { type: object }
  /api/ready:
    get:
      summary: Readiness (proceso vivo + estado BD)
      responses:
        '200':
          description: OK (ready=true; database=ok|unavailable|skipped)
  /api/establecimientos:
    get:
      summary: Listar establecimientos activos (array; compat)
      responses:
        '200': { description: OK }
  /api/establecimientos/nearby:
    get:
      summary: Búsqueda geográfica (Haversine+bbox) con filtros y paginación
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: radiusKm, in: query, schema: { type: number, default: 25, maximum: 200 } }
        - { name: limit, in: query, schema: { type: integer, default: 30, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: servicios, in: query, schema: { type: string }, description: "csv ids: agua,bano,recarga (alias electricidad,baño)" }
      responses:
        '200': { description: OK (items,count,center,radiusKm,procedencia,contract_version) }
        '400': { description: validation_error }
        '429': { description: rate_limit_exceeded }
  /api/establecimientos/{id}:
    get:
      summary: Detalle establecimiento
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: not_found }
  /api/check-ins:
    post:
      summary: Registrar check-in (legacy body o token QR firmado HMAC+exp+jti)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                usuarioId: { type: string }
                establecimientoId: { type: string }
                token: { type: string, description: "QR HMAC+exp+jti; verificado y consumido (anti-replay in-memory MVP)" }
      responses:
        '201': { description: Created }
        '400': { description: validation_error / token_error (incl. token_replayed) }
        '404': { description: not_found }
        '409': { description: check-in duplicado hoy }
        '429': { description: rate_limit_exceeded }
  /api/check-ins/mis-checkins:
    get:
      summary: Historial propio (privacidad)
      description: Requiere `x-user-email` (preferido) o `?usuarioId` legacy (menos seguro). Respuesta array (compat) + header `X-Contract-Version`.
      responses:
        '200': { description: OK (array) }
        '401': { description: no autenticado }
  /api/check-ins/qr/{establecimientoId}:
    get:
      summary: Generar QR de check-in (HMAC+exp)
      parameters:
        - { name: establecimientoId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK (qr_data_url,payload,token,exp,procedencia) }
        '404': { description: not_found }
  /api/valoraciones:
    post:
      summary: Crear valoración (Zod, 1-5)
      responses:
        '201': { description: Created }
        '400': { description: validation_error }
        '404': { description: check-in no encontrado }
        '409': { description: ya valorado }
  /api/auth/login:
    post:
      summary: Login stub (find/create por email) — D8 reemplazar
      responses:
        '200': { description: OK }
        '400': { description: validation_error }
        '429': { description: rate_limit_exceeded }
  /api/auth/me:
    get:
      summary: Usuario actual (stub x-user-email)
      responses:
        '200': { description: OK }
        '401': { description: no autenticado }
  /api/reports/summary:
    get:
      summary: KPIs agregados (sin PII)
      security: [{ ReportKey: [] }]
      responses:
        '200': { description: OK (pii:none) }
        '401': { description: clave incorrecta }
        '503': { description: REPORT_API_KEY no configurada }
  /api/reports/establishments:
    get:
      summary: Informe por establecimiento (sin PII)
      security: [{ ReportKey: [] }]
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: minCheckIns, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200': { description: OK (JSON o CSV attachment) }
        '401': { description: clave incorrecta }
        '503': { description: REPORT_API_KEY no configurada }
  /api/reports/checkins:
    get:
      summary: Check-ins agregados por establecimiento y rango (sin PII)
      security: [{ ReportKey: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200': { description: OK (agregado, pii:none) }
        '400': { description: validation_error }
        '401': { description: clave incorrecta }
        '503': { description: REPORT_API_KEY no configurada }
  /api/reports/ratings:
    get:
      summary: Valoraciones agregadas por establecimiento (sin PII ni comentarios)
      security: [{ ReportKey: [] }]
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200': { description: OK (medias+distribución, pii:none) }
  /api/reports/activity:
    get:
      summary: Serie temporal agregada de actividad (sin PII)
      security: [{ ReportKey: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: bucket, in: query, schema: { type: string, enum: [day, month], default: day } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200': { description: OK (serie agregada, pii:none) }
        '400': { description: validation_error }
components:
  securitySchemes:
    ReportKey:
      type: apiKey
      in: header
      name: X-Report-Key
  schemas:
    Procedencia:
      type: string
      description: observado | estimado | sintetico/demo | calculado_servidor (P1)
